name: CI

# BRANCH PROTECTION: main requires exactly these four status checks. The check
# name is the job's `name:` value, so these strings must not change without
# updating the branch-protection rule at the same time.
#
#   1. Tests, models, and build                                  (job hard-gates)
#   2. Simulator, Measurement, and Designer browser integration  (job browser-integration)
#   3. Native versus WASM comparison                             (job native-comparison)
#   4. Designer Chromium runtime and retained heap               (job designer-runtime-audit)
#
# Environment-bound budgets are NOT PR-blocking. The wall-clock performance
# budgets and the JS-heap retained-growth budgets are measured on one machine
# and are scheduling noise on a shared runner, so they run nightly in
# .github/workflows/nightly-budgets.yml and publish reports as artifacts.
# The designer-runtime-audit job below still builds the app, boots Chromium and
# executes the audit on every PR; only its environment-bound numeric comparison
# is advisory here.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hard-gates:
    name: Tests, models, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Restore pinned native ngspice 46
        id: ngspice46-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.tool_cache }}/ngspice-46-headless-klu
          key: ngspice-46-linux-x64-a0d1699a-${{ hashFiles('tools/native-ngspice-reference/build-ngspice-46-linux.sh') }}

      - name: Build pinned native ngspice 46
        if: steps.ngspice46-cache.outputs.cache-hit != 'true'
        env:
          NGSPICE_PREFIX: ${{ runner.tool_cache }}/ngspice-46-headless-klu
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex
          tools/native-ngspice-reference/build-ngspice-46-linux.sh

      - name: Expose pinned native ngspice 46
        env:
          NGSPICE_PREFIX: ${{ runner.tool_cache }}/ngspice-46-headless-klu
        run: |
          echo "$NGSPICE_PREFIX/bin" >> "$GITHUB_PATH"
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf "$NGSPICE_PREFIX/bin/ngspice" /opt/homebrew/bin/ngspice
          version_output="$(/opt/homebrew/bin/ngspice --version 2>&1)"
          printf '%s\n' "$version_output"
          grep -q 'ngspice-46' <<< "$version_output"
          grep -q 'Compiled with KLU Direct Linear Solver' <<< "$version_output"

      - name: Install locked dependencies
        run: npm ci

      # Exercise the same resolution that `npm run verify` uses locally, so a
      # missing native binary fails here with the documented message rather
      # than deep inside a model-package syntax check.
      - name: Require native ngspice
        run: npm run require:ngspice

      # Root tests run every workspace test script, including deterministic
      # Vitest suites and component package validation.
      - name: Run workspace tests
        run: npm test

      - name: Run workspace type checks
        run: npm run typecheck

      # The authoring tools live outside the root workspace glob and therefore
      # need explicit release gates.
      - name: Install locked model-authoring dependencies
        run: |
          python3 -m venv tools/model-factory/.venv
          tools/model-factory/.venv/bin/python -m pip install --requirement tools/model-factory/requirements.txt
          npm ci --prefix tools/native-ngspice-reference

      - name: Run model-authoring tool tests
        run: |
          npm test --prefix tools/model-factory
          npm test --prefix tools/conveyor
          npm run typecheck --prefix tools/conveyor

      # Keep policy-aware model-package schema and provenance validation visible
      # as an explicit hard gate even though the model-library test also runs it.
      - name: Validate every registered component model package
        run: node packages/model-library/validate-library.mjs

      - name: Build all workspaces
        run: npm run build

      - name: Upload web application
        uses: actions/upload-artifact@v7
        with:
          name: schemagic-web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14

  browser-integration:
    name: Simulator, Measurement, and Designer browser integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      # playwright.config.ts excludes designer-runtime.spec.ts and
      # performance-budget.spec.ts. Both are environment-bound budget suites and
      # run in .github/workflows/nightly-budgets.yml instead.
      - name: Run integrated browser suite
        run: npm run test:e2e --workspace=@opencircuit/web -- --project=chromium

  native-comparison:
    name: Native versus WASM comparison
    runs-on: ubuntu-latest
    steps:
      # These two steps stay on v4 deliberately. The Designer release audit
      # (packages/designer-release-audit) asserts the literal strings
      # "actions/checkout@v4" and "actions/setup-node@v4" for THIS job, so
      # bumping them here fails `npm run verify`. Roadmap task D.0 replaces that
      # literal pinning with property assertions; bump these in the same PR that
      # lands D.0, not before. Every other job in the repository is on v7.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/native-ngspice-reference/package-lock.json

      - name: Install locked workspace dependencies
        shell: bash
        run: npm ci

      - name: Install comparison harness dependencies
        shell: bash
        run: npm ci --prefix tools/native-ngspice-reference

      - name: Install Ubuntu ngspice
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf "$(command -v ngspice)" /opt/homebrew/bin/ngspice

      - name: Detect native ngspice version
        id: native-version
        shell: bash
        run: |
          version_output="$(ngspice --version 2>&1)"
          printf '%s\n' "$version_output"
          major="$(printf '%s\n' "$version_output" | grep -Eo 'ngspice-[0-9]+' | head -1 | cut -d- -f2 || true)"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "text<<EOF" >> "$GITHUB_OUTPUT"
          echo "$version_output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ngspice 46 is the release reference. Ubuntu's apt repository may expose
      # another major version. A non-46 comparison still provides useful drift
      # information, but it must not replace the deterministic hard gates above.
      - name: Run native and WASM comparison and behavioral application-golden suites
        id: comparison
        shell: bash
        continue-on-error: ${{ steps.native-version.outputs.major != '46' }}
        working-directory: tools/native-ngspice-reference
        env:
          OPEN_CIRCUIT_NGSPICE_ENGINE_MODULE: ${{ github.workspace }}/tools/ngspice-wasm-build/dist-loader/index.mjs
        run: node --test test/*.test.mjs && node suite.mjs && npm run test:application-golden

      # Canonical parsing and the current-production identity assertion do
      # not depend on which native ngspice package Ubuntu happens to provide.
      - name: Validate selected-passive persisted artifact and current-production identity
        id: selected-passive-detachment
        if: always()
        shell: bash
        working-directory: tools/native-ngspice-reference
        run: node --test test/selected-passive-execution-report.test.mjs && npm --prefix ../.. exec --workspace=@opencircuit/sim-engine -- vitest run test/selected-passive-application-golden.test.ts

      # The numerical rerun still requires the exact native reference. It is a
      # hard gate on ngspice 46 and informational on another Ubuntu major.
      - name: Rerun selected-passive native and WASM artifact
        id: selected-passive-rerun
        if: always()
        shell: bash
        continue-on-error: ${{ steps.native-version.outputs.major != '46' }}
        working-directory: tools/native-ngspice-reference
        env:
          OPEN_CIRCUIT_NGSPICE_ENGINE_MODULE: ${{ github.workspace }}/tools/ngspice-wasm-build/dist-loader/index.mjs
        run: npm run test:selected-passive-application-golden

      - name: Validate selected-semiconductor persisted artifact and production identity
        id: selected-semiconductor-identity
        if: always()
        shell: bash
        working-directory: tools/native-ngspice-reference
        run: node --test test/selected-semiconductor-execution-report.test.mjs && npm --prefix ../.. exec --workspace=@opencircuit/sim-engine -- vitest run test/selected-semiconductor-application-golden.test.ts

      - name: Rerun selected-semiconductor native and WASM artifact
        id: selected-semiconductor-rerun
        if: always()
        shell: bash
        continue-on-error: ${{ steps.native-version.outputs.major != '46' }}
        working-directory: tools/native-ngspice-reference
        env:
          OPEN_CIRCUIT_NGSPICE_ENGINE_MODULE: ${{ github.workspace }}/tools/ngspice-wasm-build/dist-loader/index.mjs
        run: npm run test:selected-semiconductor-application-golden

      - name: Record comparison authority
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.native-version.outputs.major }}" = "46" ]; then
            echo "### Native comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "The Ubuntu native package is ngspice 46, so comparison failures are a hard numerical gate." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Informational native comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "Ubuntu supplied ngspice major '${{ steps.native-version.outputs.major }}', not the pinned release reference 46." >> "$GITHUB_STEP_SUMMARY"
            echo "The suite ran for drift visibility with soft-fail handling. Workspace tests, model validation, and the production build remain the hard gates." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Native ngspice is not version 46; comparison results are informational."
          fi

      # These identity and report-tamper checks do not execute ngspice. Keep
      # them hard even when Ubuntu supplies a native major other than 46.
      - name: Validate ideal reviewed-RDS(on) projection identity and persisted report
        id: selected-semiconductor-rdson-projection-identity
        if: always()
        shell: bash
        working-directory: tools/native-ngspice-reference
        run: npm --prefix ../.. exec --workspace=@opencircuit/sim-engine -- vitest run test/selected-semiconductor-rdson-projection.test.ts && node --test test/selected-semiconductor-rdson-projection-report.test.mjs

      # Only the fresh native/browser-WASM numerical rerun depends on the
      # exact native reference major and may be informational off ngspice 46.
      - name: Rerun ideal reviewed-RDS(on) projection
        id: selected-semiconductor-rdson-projection
        if: always()
        shell: bash
        continue-on-error: ${{ steps.native-version.outputs.major != '46' }}
        working-directory: tools/native-ngspice-reference
        env:
          OPEN_CIRCUIT_NGSPICE_ENGINE_MODULE: ${{ github.workspace }}/tools/ngspice-wasm-build/dist-loader/index.mjs
        run: npm --prefix ../.. run build --workspace=@opencircuit/sim-engine && node selected-semiconductor-rdson-projection.mjs --verify-persisted-report

  designer-runtime-audit:
    name: Designer Chromium runtime and retained heap
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install pinned Chromium runtime
        run: npx playwright install --with-deps chromium

      # Advisory on PRs. The contract in apps/web/designer-runtime-contract.json
      # binds wall-clock and JS-heap numbers to one machine ("Results are bound
      # to the local headless Chromium version and host"), so a shared runner
      # cannot arbitrate them. The nightly workflow enforces the same audit and
      # keeps its report. A crash, a build break or a missing report still fails
      # the job through the report-presence check below.
      - name: Run bounded Designer runtime audit (budgets advisory)
        id: runtime-audit
        continue-on-error: true
        run: npm run audit:designer-runtime --workspace=@opencircuit/web

      - name: Report advisory budget outcome
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.runtime-audit.outcome }}" = "success" ]; then
            echo "Designer runtime audit met its environment-bound budgets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Advisory Designer runtime budget miss" >> "$GITHUB_STEP_SUMMARY"
            echo "The environment-bound wall-clock or JS-heap budget was not met on this shared runner." >> "$GITHUB_STEP_SUMMARY"
            echo "This does not block the pull request. The nightly budgets workflow is the enforcing run." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Designer runtime budgets are advisory on pull requests; see the nightly budgets workflow."
          fi

      - name: Upload environment-bound runtime report and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: designer-runtime-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/test-results/designer-runtime
            apps/web/playwright-report/designer-runtime
          if-no-files-found: error
          retention-days: 30
